<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>MP-04 después — un estado por tarjeta</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0B6E4F}a:hover{color:#084C37}
</style>
</helmet>
<div style="width: 375px; height: 960px; position: relative; overflow: hidden; box-sizing: border-box; background: #F3F6F4; font-family: 'Figtree', system-ui, sans-serif; color: #15241D; display: flex; flex-direction: column">
  <main style="box-sizing: border-box; padding: 16px; display: flex; flex-direction: column">
    <section style="background: #FFFFFF; border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 6px">
      <h2 style="margin: 0 0 10px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px">Agenda de hoy</h2>
      <sc-for list="{{appts}}" as="a" hint-placeholder-count="6">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <div style="font-weight: 700; font-size: 13px; color: #3E4C45">{{a.time}}</div>
          <div style="{{a.cardStyle}}">
            <div style="display: flex; flex-direction: column; gap: 4px; flex: 1 1 0; min-width: 0">
              <div style="{{a.nameStyle}}">{{a.name}}</div>
              <div style="font-size: 13px; color: #56645D">{{a.detail}}</div>
              <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-top: 2px; min-height: 24px">
                <sc-if value="{{a.hasBadge}}" hint-placeholder-val="{{ false }}">
                  <span style="{{a.badgeStyle}}">{{a.badge}}</span>
                </sc-if>
                <sc-if value="{{a.confirmed}}" hint-placeholder-val="{{ false }}">
                  <span style="display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 700; color: #0B6E4F"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg> Confirmó asistencia</span>
                </sc-if>
                <sc-if value="{{a.noAnswer}}" hint-placeholder-val="{{ false }}">
                  <span style="display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; color: #56645D"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg> Sin respuesta</span>
                </sc-if>
              </div>
            </div>
            <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0">
              <sc-if value="{{a.moveCancel}}" hint-placeholder-val="{{ false }}">
                <div style="display: flex; gap: 2px">
                  <button aria-label="Mover cita de {{a.name}}" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: transparent; color: #3E4C45; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3L4 7l4 4"></path><path d="M4 7h16"></path><path d="M16 21l4-4-4-4"></path><path d="M20 17H4"></path></svg></button>
                  <button aria-label="Cancelar cita de {{a.name}}" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: transparent; color: #3E4C45; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
                </div>
              </sc-if>
              <sc-if value="{{a.outcomeButtons}}" hint-placeholder-val="{{ false }}">
                <div role="group" aria-label="Asistencia de {{a.name}}" style="display: flex; flex-direction: column; gap: 6px">
                  <button style="height: 40px; padding: 0 12px; border-radius: 999px; border: 0; background: #0B6E4F; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg> Asistió</button>
                  <button style="height: 40px; padding: 0 12px; border-radius: 999px; border: 2px solid #CFDAD4; background: #FFFFFF; color: #3E4C45; font: inherit; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg> No asistió</button>
                </div>
              </sc-if>
              <sc-if value="{{a.showChange}}" hint-placeholder-val="{{ false }}">
                <button style="min-height: 44px; padding: 0 10px; border: 0; background: transparent; font: inherit; font-size: 13px; font-weight: 700; color: #0B6E4F; text-decoration: underline; text-underline-offset: 2px; cursor: pointer">Cambiar</button>
              </sc-if>
            </div>
          </div>
        </div>
      </sc-for>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const card = 'display:flex;gap:8px;align-items:flex-start;padding:12px 6px 12px 16px;border-radius:16px;min-height:64px;box-sizing:border-box;';
    const badge = 'font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;';
    const bg = { attended: '#EAF5F0', past: '#EAF5F0', new: '#FFF4D1', ok: '#EAF5F0', off: '#F3F6F4' };
    const badges = {
      attended: { label: 'Asistió', style: badge + 'background:#FFFFFF;color:#0B6E4F;' },
      new: { label: 'Nueva', style: badge + 'background:#FFC93C;color:#15241D;' },
      off: { label: 'Cancelada', style: badge + 'background:#FFFFFF;color:#3E4C45;' }
    };
    const rows = [
      { time: '8:00 a. m.', name: 'Mariana Gómez', detail: 'Valoración · 30 min', s: 'attended' },
      { time: '8:30 a. m.', name: 'Juan Esteban Ruiz', detail: 'Control · 15 min', s: 'past' },
      { time: '10:00 a. m.', name: 'Sofía Castaño', detail: 'Limpieza dental · 45 min', s: 'new', confirmed: false },
      { time: '11:00 a. m.', name: 'Carlos Mejía', detail: 'Valoración · 30 min', s: 'ok', confirmed: true },
      { time: '2:00 p. m.', name: 'Valentina Osorio', detail: 'Control · canceló desde el correo', s: 'off' },
      { time: '4:00 p. m.', name: 'Tomás Rendón', detail: 'Control · 15 min', s: 'ok', confirmed: false }
    ];
    const appts = rows.map((r) => {
      const upcoming = r.s === 'new' || r.s === 'ok';
      const b = badges[r.s];
      return {
        time: r.time, name: r.name, detail: r.detail,
        cardStyle: card + 'background:' + bg[r.s] + ';',
        nameStyle: r.s === 'off' ? 'font-weight:600;font-size:15px;color:#56645D;text-decoration:line-through;' : 'font-weight:700;font-size:15px;',
        hasBadge: !!b, badge: b ? b.label : '', badgeStyle: b ? b.style : '',
        confirmed: upcoming && r.confirmed,
        noAnswer: upcoming && !r.confirmed,
        moveCancel: upcoming,
        outcomeButtons: r.s === 'past',
        showChange: r.s === 'attended'
      };
    });
    return { appts };
  }
}
</script>
</body>
</html>
