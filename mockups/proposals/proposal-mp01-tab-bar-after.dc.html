        <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px; line-height: 1.15; letter-spacing: -0.8px">Hola, Laura. Hoy tienes 6 citas.</h1>

      <div style="display: flex; flex-wrap: wrap; gap: 10px">
        <button aria-label="Copiar enlace separame.app/dra-laura-perez" style="height: 46px; padding: 0 18px; border-radius: 999px; border: 2px solid #CFDAD4; background: #FFFFFF; font: inherit; font-weight: 700; font-size: 14px; color: #15241D; display: flex; gap: 8px; align-items: center; cursor: pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"></path><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"></path></svg>

        <button style="height: 46px; padding: 0 20px; border-radius: 999px; border: 0; background: #0B6E4F; font: inherit; font-weight: 700; font-size: 14px; color: #FFFFFF; display: flex; gap: 8px; align-items: center; cursor: pointer">

    </div>
    <section style="flex-shrink: 0; background: #FFFFFF; border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding-bottom: 10px">

        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
          <div style="display: flex; gap: 4px; background: #F3F6F4; border-radius: 999px; padding: 4px">
            <button aria-label="Día anterior" style="width: 36px; height: 36px; border-radius: 999px; border: 0; background: transparent; color: #3E4C45; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
            <button aria-label="Día siguiente" style="width: 36px; height: 36px; border-radius: 999px; border: 0; background: transparent; color: #3E4C45; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></button>
          </div>
          <div role="group" aria-label="Vista" style="display: flex; gap: 6px; background: #F3F6F4; border-radius: 999px; padding: 4px">
            <button aria-pressed="true" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 0; background: #FFFFFF; font: inherit; font-weight: 700; font-size: 13px; color: #15241D; cursor: pointer">Día</button>

          </div>
        </div>
      </div>
      <sc-for list="{{appts}}" as="a" hint-placeholder-count="8">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <div style="font-weight: 700; font-size: 13px; color: #3E4C45">{{a.time}}</div>
          <div style="{{a.cardStyle}}">
            <div style="display: flex; flex-direction: column; gap: 3px; flex: 1 1 160px; min-width: 0">
              <div style="{{a.nameStyle}}">{{a.name}}</div>
              <div style="font-size: 13px; color: #56645D; display: flex; flex-wrap: wrap; align-items: center; column-gap: 8px; row-gap: 4px">
                <span>{{a.detail}}</span>
                <sc-if value="{{a.hasAttendance}}" hint-placeholder-val="{{ false }}">
                  <span style="{{a.attendanceStyle}}">{{a.attendance}}</span>
                </sc-if>
              </div>
              <div style="padding-top: 4px; display: flex; align-items: center; gap: 8px">
                <span style="{{a.badgeStyle}}">{{a.badge}}</span>
                <sc-if value="{{a.showChange}}" hint-placeholder-val="{{ false }}">
                  <button style="height: 32px; padding: 0; border: 0; background: transparent; font: inherit; font-size: 13px; font-weight: 700; color: #0B6E4F; text-decoration: underline; text-underline-offset: 2px; cursor: pointer">Cambiar</button>
                </sc-if>
              </div>
            </div>
            <sc-if value="{{a.moveCancel}}" hint-placeholder-val="{{ false }}">
              <div style="display: flex; gap: 4px; flex-shrink: 0">
                <button aria-label="Mover cita de {{a.name}}" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: transparent; color: #3E4C45; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3L4 7l4 4"></path><path d="M4 7h16"></path><path d="M16 21l4-4-4-4"></path><path d="M20 17H4"></path></svg></button>
                <button aria-label="Cancelar cita de {{a.name}}" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: transparent; color: #3E4C45; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
              </div>
            </sc-if>
            <sc-if value="{{a.outcomeButtons}}" hint-placeholder-val="{{ false }}">
              <div role="group" aria-label="Asistencia de {{a.name}}" style="display: flex; gap: 8px; flex-basis: 100%; justify-content: flex-end">
                <button style="height: 36px; padding: 0 12px; border-radius: 999px; border: 0; background: #0B6E4F; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; cursor: pointer"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg> Asistió</button>
                <button style="height: 36px; padding: 0 12px; border-radius: 999px; border: 2px solid #CFDAD4; background: #FFFFFF; color: #3E4C45; font: inherit; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; cursor: pointer"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg> No asistió</button>
              </div>
            </sc-if>
          </div>
        </div>
      </sc-for>
    </section>
  </main>
  <nav aria-label="Navegación principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 68px; box-sizing: border-box; background: #FFFFFF; border-top: 1px solid #E3E8E5; padding: 4px 8px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: center">
    <a href="proposal-mp01-tab-bar-after.dc.html" aria-current="page" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none">
      <span style="width: 56px; height: 30px; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: #EAF5F0; color: #0B6E4F"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></span>
      <span style="font-size: 12px; color: #0B6E4F; font-weight: 700">Agenda</span>
    </a>
    <a href="../line-a/pro-appointments-waitlist.dc.html" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none">
      <span style="width: 56px; height: 30px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: #56645D"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"></path></svg></span>
      <span style="font-size: 12px; color: #56645D; font-weight: 600">Citas</span>
    </a>
    <a href="../line-a/pro-clients-phone.dc.html" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none">
      <span style="width: 56px; height: 30px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: #56645D"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"></path></svg></span>
      <span style="font-size: 12px; color: #56645D; font-weight: 600">Clientes</span>
    </a>
    <a href="proposal-mp01-tab-bar-after-more-sheet.dc.html" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none">
      <span style="width: 56px; height: 30px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: #56645D"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"></path></svg></span>
      <span style="font-size: 12px; color: #56645D; font-weight: 600">Más</span>
    </a>
  </nav>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const card = 'flex-grow:1;min-width:0;display:flex;flex-wrap:wrap;column-gap:12px;row-gap:8px;align-items:center;padding:10px 10px 10px 16px;border-radius:16px;min-height:64px;box-sizing:border-box;';
    const badge = 'font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap;';
    const mini = 'font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;';
    const kinds = {
      ok: { card: card + 'background:#EAF5F0;', name: 'font-weight:700;font-size:15px;', badge: badge + 'background:#0B6E4F;color:#FFFFFF;', label: 'Confirmada' },
      fresh: { card: card + 'background:#FFF4D1;', name: 'font-weight:700;font-size:15px;', badge: badge + 'background:#FFC93C;color:#15241D;', label: 'Nueva' },
      free: { card: card + 'background:#FFFFFF;border:2px dashed #CFDAD4;', name: 'font-weight:600;font-size:15px;color:#56645D;', badge: badge + 'background:#F3F6F4;color:#3E4C45;', label: 'Libre' },
      off: { card: card + 'background:#F3F6F4;', name: 'font-weight:600;font-size:15px;color:#56645D;text-decoration:line-through;', badge: badge + 'background:#FFFFFF;color:#3E4C45;', label: 'Cancelada' }
    };
    const rows = [
      { time: '8:00 a. m.', name: 'Mariana Gómez', detail: 'Valoración · 30 min', k: 'ok', outcome: 'attended' },
      { time: '8:30 a. m.', name: 'Juan Esteban Ruiz', detail: 'Control · 15 min', k: 'ok', past: true },
      { time: '9:30 a. m.', name: 'Espacio libre', detail: '30 min disponibles', k: 'free' },
      { time: '10:00 a. m.', name: 'Sofía Castaño', detail: 'Limpieza dental · 45 min', k: 'fresh', confirmed: false },
      { time: '11:00 a. m.', name: 'Carlos Mejía', detail: 'Valoración · 30 min', k: 'ok', confirmed: true },
      { time: '2:00 p. m.', name: 'Valentina Osorio', detail: 'Control · canceló desde el correo', k: 'off' },
      { time: '3:00 p. m.', name: 'Daniela Herrera', detail: 'Limpieza dental · 45 min', k: 'ok', confirmed: true },
      { time: '4:00 p. m.', name: 'Tomás Rendón', detail: 'Control · 15 min', k: 'ok', confirmed: false }
    ];
    const appts = rows.map((r) => {
      const k = kinds[r.k];
      const active = r.k === 'ok' || r.k === 'fresh';
      const done = !!r.outcome;
      return {
        time: r.time, name: r.name, detail: r.detail,
        cardStyle: k.card, nameStyle: k.name,
        badge: done ? 'Asistió' : k.label,
        badgeStyle: done ? badge + 'background:#FFFFFF;color:#0B6E4F;' : k.badge,
        hasAttendance: active && !r.past && !done,
        attendance: r.confirmed ? 'Confirmó' : 'Sin confirmar',
        attendanceStyle: mini + (r.confirmed ? 'background:#FFFFFF;color:#0B6E4F;' : 'background:rgba(255,255,255,0.7);color:#56645D;'),
        showChange: done,
        moveCancel: active && !r.past && !done,
        outcomeButtons: active && !!r.past
      };
    });
    return { appts };
  }
}
</script>
