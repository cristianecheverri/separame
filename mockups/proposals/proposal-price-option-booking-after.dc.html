<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Precio · después · Reserva paso 1</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#56645D}a:hover{color:#3E4C45}
</style>
</helmet>
<div style="width: 375px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'Figtree', system-ui, sans-serif; color: #15241D; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; border-bottom: 1px solid #E3E8E5">
    <div style="display: flex; align-items: center; gap: 10px; min-height: 44px">
      <div style="width: 44px; height: 44px; border-radius: 999px; background: #0B6E4F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 16px; flex-shrink: 0">LP</div>
      <div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1; min-width: 0">
        <div style="font-weight: 700; font-size: 15px">Dra. Laura Pérez</div>
        <div style="font-size: 13px; color: #56645D">Odontóloga · El Poblado, Medellín</div>
      </div>
      <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 16px; color: #0B6E4F">sepárame<span style="color: #E0A800">.</span></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
        <span style="height: 6px; border-radius: 999px; background: #0B6E4F"></span>
        <span style="height: 6px; border-radius: 999px; background: #E3E8E5"></span>
        <span style="height: 6px; border-radius: 999px; background: #E3E8E5"></span>
        <span style="height: 6px; border-radius: 999px; background: #E3E8E5"></span>
      </div>
      <div style="font-size: 13px; font-weight: 600; color: #56645D">Paso 1 de 4 · Servicio</div>
    </div>
  </header>

  <section style="flex-grow: 1; min-height: 0; padding: 22px 20px 12px; display: flex; flex-direction: column; gap: 12px">
    <h1 style="margin: 0 0 4px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px; line-height: 1.1; letter-spacing: -0.6px">¿Qué necesitas?</h1>
    <sc-for list="{{services}}" as="s" hint-placeholder-count="4">
      <button style="display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 16px; border-radius: 20px; font: inherit; color: inherit; cursor: pointer; min-height: 84px; box-sizing: border-box; border: 2px solid #E3E8E5; background: #FFFFFF">
        <span style="width: 22px; height: 22px; border-radius: 999px; flex-shrink: 0; box-sizing: border-box; border: 2px solid #B9C4BE; background: #FFFFFF"></span>
        <span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0">
          <span style="font-weight: 700; font-size: 17px">{{s.name}}</span>
          <span style="font-size: 14px; color: #56645D">{{s.dur}} · {{s.desc}}</span>
        </span>
        <span style="{{s.priceStyle}}">{{s.price}}</span>
      </button>
    </sc-for>
    <div style="font-size: 13px; color: #56645D">Precios de referencia. El valor final se confirma en la cita.</div>
    <div style="margin-top: auto; text-align: center; font-size: 12px; color: #56645D"><a href="#" style="text-decoration: none">Privacidad</a> · <a href="#" style="text-decoration: none">Términos</a></div>
  </section>

  <footer style="padding: 12px 16px 18px; border-top: 1px solid #E3E8E5; background: #FFFFFF">
    <button disabled style="width: 100%; height: 56px; border-radius: 999px; border: 0; font: inherit; font-weight: 700; font-size: 17px; background: #DCE3DF; color: #56645D; cursor: not-allowed">Elige un servicio</button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const price = 'font-weight:700;font-size:15px;flex-shrink:0;white-space:nowrap;';
    return {
      services: [
        { name: 'Valoración', dur: '30 min', desc: 'Primera vez', price: '$60.000', priceStyle: price },
        { name: 'Limpieza dental', dur: '45 min', desc: 'Incluye profilaxis', price: '$120.000', priceStyle: price },
        { name: 'Control', dur: '15 min', desc: 'En tratamiento', price: 'Precio a convenir', priceStyle: 'font-weight:600;font-size:13px;color:#3E4C45;flex-shrink:0;text-align:right;max-width:84px;line-height:1.25;' },
        { name: 'Urgencia', dur: '30 min', desc: 'Dolor o molestia', price: '', priceStyle: 'display:none;' }
      ]
    };
  }
}
</script>
</body>
</html>
