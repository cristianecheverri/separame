<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>MP-06 antes — Lista de espera</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0B6E4F}a:hover{color:#084C37}
</style>
</helmet>
<div style="width: 375px; height: 844px; box-sizing: border-box; overflow: hidden; background: #F3F6F4; font-family: 'Figtree', system-ui, sans-serif; color: #15241D; display: flex; flex-direction: column">

  <header style="height: 60px; flex-shrink: 0; background: #0B6E4F; color: #FFFFFF; padding: 0 16px; display: flex; align-items: center; justify-content: space-between">
    <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.5px; line-height: 1">sepárame<span style="color: #FFC93C">.</span></span>
    <button aria-label="Abrir menú" style="width: 44px; height: 44px; margin-right: -8px; border-radius: 999px; border: 0; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
  </header>

  <main style="padding: 20px 16px; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px; line-height: 1.15; letter-spacing: -0.8px">Citas</h1>
      <div style="font-size: 15px; color: #56645D">Tus citas próximas y pasadas, en un solo lugar.</div>
    </div>
    <div>
      <button style="height: 46px; padding: 0 20px; border-radius: 999px; border: 0; background: #0B6E4F; font: inherit; font-weight: 700; font-size: 14px; color: #FFFFFF; display: inline-flex; gap: 8px; align-items: center; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        Nueva cita
      </button>
    </div>

    <section style="background: #FFFFFF; border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 16px">
      <div role="group" aria-label="Mostrar" style="align-self: flex-start; display: flex; gap: 6px; background: #F3F6F4; border-radius: 999px; padding: 4px">
        <button aria-pressed="false" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 0; background: transparent; font: inherit; font-weight: 600; font-size: 14px; color: #3E4C45; white-space: nowrap; cursor: pointer">Próximas</button>
        <button aria-pressed="false" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 0; background: transparent; font: inherit; font-weight: 600; font-size: 14px; color: #3E4C45; white-space: nowrap; cursor: pointer">Pasadas</button>
        <button aria-pressed="true" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 0; background: #FFFFFF; font: inherit; font-weight: 700; font-size: 14px; color: #15241D; white-space: nowrap; cursor: pointer">Lista de espera</button>
      </div>

      <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{entries}}" as="e" hint-placeholder-count="3">
          <li style="background: #F3F6F4; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
            <div style="display: flex; flex-direction: column; gap: 2px">
              <span style="font-weight: 700; font-size: 15px">{{e.name}}</span>
              <span style="font-size: 13px; color: #3E4C45">{{e.detail}}</span>
              <sc-if value="{{e.notified}}" hint-placeholder-val="{{ false }}">
                <span style="font-size: 12px; color: #56645D">Le avisamos 1 vez</span>
              </sc-if>
            </div>
            <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
              <a href="#" style="height: 36px; padding: 0 12px; border-radius: 999px; border: 2px solid #CFDAD4; background: #FFFFFF; color: #15241D; display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; text-decoration: none; box-sizing: border-box"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"></path></svg>Llamar</a>
              <a href="#" style="height: 36px; padding: 0 12px; border-radius: 999px; border: 2px solid #CFDAD4; background: #FFFFFF; color: #15241D; display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; text-decoration: none; box-sizing: border-box"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1.4-4.2A8 8 0 1 1 8.6 19z"></path></svg>WhatsApp</a>
              <sc-if value="{{e.email}}" hint-placeholder-val="{{ true }}">
                <a href="#" style="height: 36px; padding: 0 12px; border-radius: 999px; border: 2px solid #CFDAD4; background: #FFFFFF; color: #15241D; display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; text-decoration: none; box-sizing: border-box"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>Correo</a>
              </sc-if>
              <button style="height: 36px; padding: 0 12px; border-radius: 999px; border: 0; background: transparent; font: inherit; font-weight: 700; font-size: 13px; color: #3E4C45; cursor: pointer">Quitar</button>
            </div>
          </li>
        </sc-for>
      </ul>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      entries: [
        { name: 'Paula Restrepo', detail: 'Limpieza dental · Jue 22 · Vie 23', notified: false, email: true },
        { name: 'Esteban Gil', detail: 'Valoración · Mié 21', notified: true, email: true },
        { name: 'Lina Marcela Ruiz', detail: 'Control · Lun 26 · Mar 27 · Mié 28', notified: false, email: false },
        { name: 'Andrés Cardona', detail: 'Valoración · Vie 23', notified: false, email: true }
      ]
    };
  }
}
</script>
</body>
</html>
