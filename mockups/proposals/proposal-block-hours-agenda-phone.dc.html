<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Propuesta · Bloquear horas desde la agenda</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0B6E4F}a:hover{color:#084C37}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F6F4; font-family: 'Figtree', system-ui, sans-serif; color: #15241D; display: flex; flex-direction: column; position: relative; overflow: hidden">

  <header style="height: 60px; flex-shrink: 0; background: #0B6E4F; color: #FFFFFF; padding: 0 16px; display: flex; align-items: center">
    <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.5px; line-height: 1">sepárame<span style="color: #FFC93C">.</span></span>
  </header>

  <main style="box-sizing: border-box; padding: 20px 16px 96px; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px; line-height: 1.2; letter-spacing: -0.6px; min-width: 0">Hola, Laura · 5 citas hoy</h1>
      <button aria-label="Compartir mi enlace" style="height: 44px; padding: 0 14px; flex-shrink: 0; border-radius: 999px; border: 2px solid #CFDAD4; background: #FFFFFF; font: inherit; font-weight: 700; font-size: 14px; color: #15241D; display: flex; gap: 6px; align-items: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"></path></svg> Compartir</button>
    </div>
    <section style="background: #FFFFFF; border-radius: 24px; padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; padding-bottom: 10px">
        <div style="display: flex; align-items: center; gap: 2px">
          <button aria-label="Día anterior" style="width: 40px; height: 44px; border-radius: 999px; border: 0; background: transparent; color: #15241D; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
          <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 18px; white-space: nowrap">Mar 20 oct.</h2>
          <button aria-label="Día siguiente" style="width: 40px; height: 44px; border-radius: 999px; border: 0; background: transparent; color: #15241D; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></button>
        </div>
        <div role="group" aria-label="Vista" style="display: flex; gap: 6px; background: #F3F6F4; border-radius: 999px; padding: 4px">
          <button aria-pressed="true" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 0; background: #FFFFFF; font: inherit; font-weight: 700; font-size: 13px; color: #15241D; cursor: pointer">Día</button>
          <button aria-pressed="false" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 0; background: transparent; font: inherit; font-weight: 600; font-size: 13px; color: #3E4C45; cursor: pointer">Semana</button>
        </div>
      </div>
      <sc-for list="{{rows}}" as="a" hint-placeholder-count="6">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <div style="font-weight: 700; font-size: 13px; color: #3E4C45">{{a.time}}</div>
          <div style="{{a.cardStyle}}">
            <sc-if value="{{a.blocked}}" hint-placeholder-val="{{ false }}">
              <span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 999px; background: #FFFFFF; color: #3E4C45; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg></span>
            </sc-if>
            <div style="display: flex; flex-direction: column; gap: 3px; flex: 1 1 0; min-width: 0">
              <div style="{{a.nameStyle}}">{{a.name}}</div>
              <div style="font-size: 13px; color: #56645D">{{a.detail}}</div>
              <sc-if value="{{a.hasPill}}" hint-placeholder-val="{{ true }}">
                <div style="padding-top: 4px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
                  <span style="{{a.badgeStyle}}">{{a.badge}}</span>
                </div>
              </sc-if>
            </div>
            <sc-if value="{{a.free}}" hint-placeholder-val="{{ false }}">
              <button onClick="{{openSheet}}" aria-label="Bloquear el espacio libre de las {{a.time}}" style="height: 44px; padding: 0 4px; flex-shrink: 0; border: 0; background: transparent; font: inherit; font-size: 14px; font-weight: 700; color: #0B6E4F; text-decoration: underline; text-underline-offset: 2px; cursor: pointer">Bloquear</button>
            </sc-if>
            <sc-if value="{{a.blocked}}" hint-placeholder-val="{{ false }}">
              <button aria-label="Quitar el bloqueo de las {{a.time}}" style="height: 44px; padding: 0 4px; flex-shrink: 0; border: 0; background: transparent; font: inherit; font-size: 14px; font-weight: 700; color: #0B6E4F; text-decoration: underline; text-underline-offset: 2px; cursor: pointer">Quitar</button>
            </sc-if>
          </div>
        </div>
      </sc-for>
    </section>
  </main>

  <sc-if value="{{menuOpen}}" hint-placeholder-val="{{ true }}">
    <div aria-hidden="true" onClick="{{toggleMenu}}" style="position: absolute; inset: 0; background: rgba(21,36,29,0.45); z-index: 2"></div>
    <div role="menu" aria-label="Agregar" style="position: absolute; right: 16px; bottom: 152px; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; z-index: 3">
      <a role="menuitem" href="proposal-block-hours-sheet-phone.dc.html" style="height: 52px; padding: 0 20px; border-radius: 999px; background: #FFFFFF; color: #15241D; font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 10px; text-decoration: none; box-shadow: 0 8px 20px rgba(21,36,29,0.18)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>Bloquear horas</a>
      <a role="menuitem" href="../line-a/pro-new-appointment-phone.dc.html" style="height: 52px; padding: 0 20px; border-radius: 999px; background: #FFFFFF; color: #15241D; font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 10px; text-decoration: none; box-shadow: 0 8px 20px rgba(21,36,29,0.18)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Nueva cita</a>
    </div>
  </sc-if>
  <button onClick="{{toggleMenu}}" aria-label="{{fabLabel}}" aria-expanded="{{menuOpen}}" style="position: absolute; right: 16px; bottom: 84px; width: 56px; height: 56px; border-radius: 999px; border: 0; background: #0B6E4F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(21,36,29,0.22); z-index: 3; cursor: pointer"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true" style="{{fabIconStyle}}"><path d="M12 5v14M5 12h14"></path></svg></button>

  <nav aria-label="Navegación principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 68px; box-sizing: border-box; background: #FFFFFF; border-top: 1px solid #E3E8E5; padding: 4px 8px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: center; z-index: 1">
    <a href="../line-a/pro-agenda-phone.dc.html" aria-current="page" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none">
      <span style="width: 56px; height: 30px; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: #EAF5F0; color: #0B6E4F"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></span>
      <span style="font-size: 12px; color: #0B6E4F; font-weight: 700">Agenda</span>
    </a>
    <a href="../line-a/pro-appointments-waitlist.dc.html" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none">
      <span style="width: 56px; height: 30px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: #56645D"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"></path></svg></span>
      <span style="font-size: 12px; color: #56645D; font-weight: 600">Citas</span>
    </a>
    <a href="../line-a/pro-clients-phone.dc.html" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none">
      <span style="width: 56px; height: 30px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: #56645D"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"></path></svg></span>
      <span style="font-size: 12px; color: #56645D; font-weight: 600">Clientes</span>
    </a>
    <a href="../line-a/pro-more-sheet-phone.dc.html" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none">
      <span style="width: 56px; height: 30px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: #56645D"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"></path></svg></span>
      <span style="font-size: 12px; color: #56645D; font-weight: 600">Más</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"menuOpen":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = Object.assign({ menu: this.props.menuOpen !== false }, this.state || {});
    const card = 'display:flex;align-items:flex-start;gap:10px;padding:12px 8px 12px 16px;border-radius:16px;min-height:64px;box-sizing:border-box;';
    const badge = 'font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap;';
    const kinds = {
      ok: { card: card + 'background:#EAF5F0;', name: 'font-weight:700;font-size:15px;' },
      done: { card: card + 'background:#EAF5F0;', name: 'font-weight:700;font-size:15px;', pill: 'Asistió', pillStyle: badge + 'background:#FFFFFF;color:#0B6E4F;' },
      free: { card: card + 'background:#FFFFFF;border:2px dashed #CFDAD4;', name: 'font-weight:600;font-size:15px;color:#56645D;', pill: 'Libre', pillStyle: badge + 'background:#F3F6F4;color:#3E4C45;' },
      blocked: { card: card + 'background:#F3F6F4;border:2px solid #E3E8E5;padding-left:10px;', name: 'font-weight:700;font-size:15px;color:#3E4C45;', pill: 'Nadie puede reservar', pillStyle: badge + 'background:#FFFFFF;color:#3E4C45;' }
    };
    const rows = [
      { time: '8:00 a. m.', name: 'Mariana Gómez', detail: 'Valoración · 30 min', k: 'done' },
      { time: '9:30 a. m.', name: 'Espacio libre', detail: '30 min disponibles', k: 'free' },
      { time: '10:00 a. m.', name: 'Sofía Castaño', detail: 'Limpieza dental · 45 min', k: 'ok' },
      { time: '11:00 a. m.', name: 'Carlos Mejía', detail: 'Valoración · 30 min', k: 'ok' },
      { time: '2:00 p. m.', name: 'No disponible', detail: '2:00 – 4:00 p. m. · Diligencia personal', k: 'blocked' },
      { time: '4:00 p. m.', name: 'Tomás Rendón', detail: 'Control · 15 min', k: 'ok' }
    ];
    return {
      menuOpen: st.menu,
      toggleMenu: () => this.setState({ menu: !st.menu }),
      openSheet: () => this.setState({ menu: true }),
      fabLabel: st.menu ? 'Cerrar menú' : 'Agregar',
      fabIconStyle: st.menu ? 'transform:rotate(45deg);' : '',
      rows: rows.map((r) => {
        const k = kinds[r.k];
        return {
          time: r.time, name: r.name, detail: r.detail, cardStyle: k.card, nameStyle: k.name,
          hasPill: !!k.pill, badge: k.pill || '', badgeStyle: k.pillStyle || '',
          free: r.k === 'free', blocked: r.k === 'blocked'
        };
      })
    };
  }
}
</script>
</body>
</html>
