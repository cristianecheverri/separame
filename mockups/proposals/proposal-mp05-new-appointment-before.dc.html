<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>MP-05 antes — Nueva cita</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0B6E4F}a:hover{color:#084C37}
</style>
</helmet>
<div style="width: 375px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F3F6F4; font-family: 'Figtree', system-ui, sans-serif; color: #15241D">

  <header style="height: 60px; background: #0B6E4F; color: #FFFFFF; padding: 0 16px; display: flex; align-items: center; justify-content: space-between">
    <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.5px; line-height: 1">sepárame<span style="color: #FFC93C">.</span></span>
    <span aria-hidden="true" style="width: 44px; height: 44px; margin-right: -8px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></span>
  </header>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(21,36,29,0.45)"></div>

  <div role="dialog" aria-modal="true" aria-labelledby="mp05b-title" style="position: absolute; left: 0; right: 0; bottom: 0; height: 776px; background: #FFFFFF; border-radius: 24px 24px 0 0; display: flex; flex-direction: column">
    <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 20px 20px 8px">
      <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
        <h2 id="mp05b-title" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px; line-height: 1.2">Nueva cita</h2>
        <div style="font-size: 14px; color: #56645D; line-height: 1.4">Agéndala tú mismo: la persona recibe la confirmación si escribes su correo.</div>
      </div>
      <button aria-label="Cerrar" style="width: 44px; height: 44px; margin: -8px -8px 0 0; border-radius: 999px; border: 0; background: transparent; color: #3E4C45; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>

    <div style="flex: 1 1 0; min-height: 0; overflow: hidden; padding: 12px 20px; display: flex; flex-direction: column; gap: 20px">
      <fieldset style="border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px">
        <legend style="font-size: 14px; font-weight: 600; margin-bottom: 8px; padding: 0">Servicio</legend>
        <sc-for list="{{services}}" as="s" hint-placeholder-count="4">
          <button aria-pressed="false" style="display: flex; align-items: center; gap: 12px; border-radius: 16px; border: 2px solid #E3E8E5; background: #FFFFFF; padding: 12px 14px; min-height: 56px; text-align: left; font: inherit; color: #15241D; cursor: pointer">
            <span style="width: 22px; height: 22px; border-radius: 999px; box-sizing: border-box; border: 2px solid #B9C4BE; background: #FFFFFF; flex-shrink: 0"></span>
            <span style="display: flex; flex-direction: column; min-width: 0">
              <span style="font-weight: 700; font-size: 15px">{{s.name}}</span>
              <span style="font-size: 13px; color: #56645D">{{s.detail}}</span>
            </span>
          </button>
        </sc-for>
      </fieldset>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="font-size: 14px; font-weight: 600">Día y hora</div>
        <div style="background: #F3F6F4; border-radius: 18px; padding: 18px; font-size: 14px; color: #3E4C45; text-align: center">Elige un servicio para ver las horas libres.</div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="mp05b-name" style="font-size: 14px; font-weight: 600">Nombre</label>
          <input id="mp05b-name" type="text" autocomplete="off" style="height: 48px; box-sizing: border-box; width: 100%; border-radius: 14px; border: 2px solid #E3E8E5; background: #FFFFFF; padding: 0 14px; font: inherit; font-size: 15px; color: #15241D">
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="mp05b-phone" style="font-size: 14px; font-weight: 600">Celular (opcional)</label>
          <input id="mp05b-phone" type="tel" placeholder="300 123 4567" style="height: 48px; box-sizing: border-box; width: 100%; border-radius: 14px; border: 2px solid #E3E8E5; background: #FFFFFF; padding: 0 14px; font: inherit; font-size: 15px; color: #15241D">
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="mp05b-mail" style="font-size: 14px; font-weight: 600">Correo (opcional)</label>
          <input id="mp05b-mail" type="email" style="height: 48px; box-sizing: border-box; width: 100%; border-radius: 14px; border: 2px solid #E3E8E5; background: #FFFFFF; padding: 0 14px; font: inherit; font-size: 15px; color: #15241D">
          <span style="font-size: 12px; color: #56645D">Sin correo no se envían confirmación ni recordatorio.</span>
        </div>
      </div>
    </div>

    <div style="padding: 12px 20px 20px; display: flex; gap: 10px; border-top: 1px solid #E3E8E5; margin-top: 4px">
      <button style="height: 48px; padding: 0 24px; flex-grow: 1; border-radius: 999px; border: 0; background: #0B6E4F; color: #FFFFFF; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer">Agendar cita</button>
      <button style="height: 48px; padding: 0 20px; flex-grow: 1; border-radius: 999px; border: 2px solid #CFDAD4; background: #FFFFFF; color: #15241D; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer">Volver</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      services: [
        { name: 'Valoración', detail: '30 min · $60.000' },
        { name: 'Limpieza dental', detail: '45 min · $120.000' },
        { name: 'Control', detail: '15 min · Sin costo' },
        { name: 'Blanqueamiento', detail: '1 h · $450.000 · oculto' }
      ]
    };
  }
}
</script>
</body>
</html>
