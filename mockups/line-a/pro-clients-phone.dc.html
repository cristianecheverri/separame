<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Clientes — celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0B6E4F}a:hover{color:#084C37}
</style>
</helmet>
<div style="width: 390px; min-height: 1708px; box-sizing: border-box; background: #F3F6F4; font-family: 'Figtree', system-ui, sans-serif; color: #15241D; display: flex; flex-direction: column">

  <header style="height: 60px; flex-shrink: 0; background: #0B6E4F; color: #FFFFFF; padding: 0 16px; display: flex; align-items: center; justify-content: space-between">
    <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.5px; line-height: 1">sepárame<span style="color: #FFC93C">.</span></span>
  </header>

  <main style="box-sizing: border-box; padding: 20px 16px; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px; line-height: 1.15; letter-spacing: -0.8px">Clientes</h1>
        <div style="font-size: 15px; color: #56645D">Quiénes te han reservado, con su historial de citas.</div>
      </div>
      <label for="clients-search-phone" style="height: 46px; width: 100%; box-sizing: border-box; border-radius: 999px; background: #FFFFFF; border: 2px solid #CFDAD4; display: flex; align-items: center; gap: 8px; padding: 0 14px; color: #56645D">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <input id="clients-search-phone" type="search" placeholder="Buscar por nombre, correo o celular" aria-label="Buscar por nombre, correo o celular" style="border: 0; outline: none; font: inherit; font-size: 14px; flex-grow: 1; min-width: 0; background: transparent; color: #15241D">
      </label>
    </div>

    <ul aria-label="Clientes" style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px">
      <sc-for list="{{clients}}" as="c" hint-placeholder-count="10">
        <li>
          <a href="{{c.href}}" style="background: #FFFFFF; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 4px; text-decoration: none; color: #15241D; border: 2px solid #FFFFFF">
            <span style="font-weight: 700; font-size: 16px">{{c.name}}</span>
            <span style="font-size: 14px; color: #56645D">{{c.phone}}</span>
            <span style="font-size: 13px; color: #3E4C45">{{c.count}} · <span style="{{c.noShowStyle}}">{{c.noShows}}</span></span>
            <span style="font-size: 13px; color: #56645D">Última: {{c.last}} · Próxima: {{c.next}}</span>
          </a>
        </li>
      </sc-for>
    </ul>
  </main>
  <nav aria-label="Navegación principal" style="margin-top: auto; height: 68px; flex-shrink: 0; box-sizing: border-box; background: #FFFFFF; border-top: 1px solid #E3E8E5; padding: 4px 8px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: center">
    <a href="pro-agenda-phone.dc.html" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none">
      <span style="width: 56px; height: 30px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: #56645D"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></span>
      <span style="font-size: 12px; color: #56645D; font-weight: 600">Agenda</span>
    </a>
    <a href="pro-appointments-waitlist.dc.html" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none">
      <span style="width: 56px; height: 30px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: #56645D"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"></path></svg></span>
      <span style="font-size: 12px; color: #56645D; font-weight: 600">Citas</span>
    </a>
    <a href="pro-clients-phone.dc.html" aria-current="page" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none">
      <span style="width: 56px; height: 30px; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: #EAF5F0; color: #0B6E4F"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"></path></svg></span>
      <span style="font-size: 12px; color: #0B6E4F; font-weight: 700">Clientes</span>
    </a>
    <a href="pro-more-sheet-phone.dc.html" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none">
      <span style="width: 56px; height: 30px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: #56645D"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"></path></svg></span>
      <span style="font-size: 12px; color: #56645D; font-weight: 600">Más</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1708}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [
      ['Sofía Castaño', '+57 300 102 3757', 1, 0, '—', '20 oct. 2026'],
      ['Juan Esteban Ruiz', '+57 300 101 5838', 1, 0, '20 oct. 2026', '—'],
      ['Mariana Gómez', '+57 300 100 7919', 1, 0, '20 oct. 2026', '—'],
      ['Carlos Mejía', '+57 300 103 1676', 1, 0, '—', '20 oct. 2026'],
      ['Ana María Salazar', '+57 300 135 6355', 10, 0, '8 oct. 2026', '21 oct. 2026'],
      ['Lucía Restrepo', '+57 300 137 2193', 16, 1, '14 oct. 2026', '21 oct. 2026'],
      ['Andrés Cardona', '+57 300 138 0112', 16, 3, '14 oct. 2026', '21 oct. 2026'],
      ['Paula Jaramillo', '+57 300 132 4679', 11, 3, '7 oct. 2026', '21 oct. 2026'],
      ['Miguel Ángel Toro', '+57 300 133 2598', 12, 4, '7 oct. 2026', '22 oct. 2026'],
      ['Camila Zapata', '+57 300 134 0517', 15, 1, '19 oct. 2026', '22 oct. 2026'],
      ['Santiago Vélez', '+57 300 134 8436', 13, 2, '19 oct. 2026', '22 oct. 2026']
    ];
    return {
      clients: rows.map((r, i) => ({
        name: r[0], phone: r[1],
        count: r[2] === 1 ? '1 cita' : r[2] + ' citas',
        noShows: r[3] === 1 ? '1 inasistencia' : r[3] + ' inasistencias',
        noShowStyle: r[3] ? 'color:#7A3E00;font-weight:700;' : '',
        last: r[4], next: r[5],
        href: 'pro-client-detail.dc.html'
      }))
    };
  }
}
</script>
</body>
</html>
