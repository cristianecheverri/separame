<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Día lleno — lista de espera</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0B6E4F}a:hover{color:#084C37}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'Figtree', system-ui, sans-serif; color: #15241D; display: flex; flex-direction: column; overflow: hidden">

  <header style="padding: 14px 16px 14px; display: flex; flex-direction: column; gap: 14px; border-bottom: 1px solid #E3E8E5">
    <div style="display: flex; align-items: center; gap: 10px; min-height: 44px">
      <a href="client-booking-steps.dc.html" aria-label="Paso anterior" style="width: 44px; height: 44px; border-radius: 999px; background: #F3F6F4; color: #15241D; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
      <div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1; min-width: 0">
        <div style="font-weight: 700; font-size: 15px">Dra. Laura Pérez</div>
        <div style="font-size: 13px; color: #56645D">Odontóloga · El Poblado, Medellín</div>
      </div>
      <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 16px; color: #0B6E4F">sepárame<span style="color: #E0A800">.</span></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
        <span style="height: 6px; border-radius: 999px; display: block; background: #0B6E4F"></span>
        <span style="height: 6px; border-radius: 999px; display: block; background: #0B6E4F"></span>
        <span style="height: 6px; border-radius: 999px; display: block; background: #E3E8E5"></span>
        <span style="height: 6px; border-radius: 999px; display: block; background: #E3E8E5"></span>
      </div>
      <div style="font-size: 13px; font-weight: 600; color: #56645D">Paso 2 de 4 · Día y hora</div>
      <div role="list" aria-label="Lo que elegiste" style="display: flex; gap: 6px; min-width: 0">
        <span role="listitem" style="display: flex; min-width: 0">
          <a href="client-booking-steps.dc.html" aria-label="Cambiar servicio: Valoración · 30 min · $60.000" style="display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 999px; background: #EAF5F0; color: #084C37; font-size: 13px; font-weight: 600; text-decoration: none; min-width: 0"><span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Valoración · 30 min · $60.000</span></a>
        </span>
      </div>
    </div>
  </header>

  <div style="flex-grow: 1; min-height: 0; padding: 22px 20px 16px; display: flex; flex-direction: column">
    <section style="display: flex; flex-direction: column; gap: 14px">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px; line-height: 1.1; letter-spacing: -0.6px">¿Cuándo te sirve?</h1>
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-size: 14px; font-weight: 600; color: #56645D">Octubre 2026</span>
        <div style="display: flex; gap: 4px">
          <button disabled aria-label="Semana anterior" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: #F3F6F4; color: #15241D; opacity: 0.4; display: flex; align-items: center; justify-content: center; cursor: default"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
          <button aria-label="Semana siguiente" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: #F3F6F4; color: #15241D; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></button>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
          <button disabled="{{d.disabled}}" aria-pressed="{{d.selected}}" aria-label="{{d.label}}" style="{{d.style}}">
            <span style="font-size: 12px; font-weight: 600">{{d.dow}}</span>
            <span style="font-size: 18px; font-weight: 700">{{d.num}}</span>
          </button>
        </sc-for>
      </div>
      <div style="background: #F3F6F4; border-radius: 18px; padding: 18px; font-size: 14px; color: #3E4C45; text-align: center; line-height: 1.45">Ya no quedan horas libres este día.</div>
      <a href="client-waitlist-join.dc.html" style="display: flex; align-items: center; gap: 12px; width: 100%; box-sizing: border-box; padding: 16px; border-radius: 20px; border: 2px solid #FFF4D1; background: #FFF4D1; color: #15241D; text-decoration: none">
        <span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10 21a2 2 0 0 0 4 0"></path></svg></span>
        <span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
          <span style="font-weight: 700; font-size: 16px">¿No encuentras hora?</span>
          <span style="font-size: 14px; color: #3E4C45">Te avisamos si se libera un cupo</span>
        </span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M9 18l6-6-6-6"></path></svg>
      </a>
    </section>
  </div>

  <footer style="padding: 12px 16px 18px; border-top: 1px solid #E3E8E5; display: flex; flex-direction: column; gap: 10px; background: #FFFFFF">
    <button disabled style="height: 56px; border-radius: 999px; border: 0; font: inherit; font-weight: 700; font-size: 17px; background: #DCE3DF; color: #56645D; cursor: not-allowed">Elige día y hora</button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dayBase = 'display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;border-radius:14px;font:inherit;min-height:64px;border:2px solid;';
    const days = [
      { dow: 'Mar', num: '20', k: 'sel', label: 'Martes 20 de octubre, sin horas libres' },
      { dow: 'Mié', num: '21', k: 'open', label: 'Miércoles 21 de octubre' },
      { dow: 'Jue', num: '22', k: 'open', label: 'Jueves 22 de octubre' },
      { dow: 'Vie', num: '23', k: 'open', label: 'Viernes 23 de octubre' },
      { dow: 'Sáb', num: '24', k: 'open', label: 'Sábado 24 de octubre' },
      { dow: 'Dom', num: '25', k: 'off', label: 'Domingo 25 de octubre' },
      { dow: 'Lun', num: '26', k: 'open', label: 'Lunes 26 de octubre' }
    ];
    const tone = {
      sel: 'background:#0B6E4F;border-color:#0B6E4F;color:#FFFFFF;cursor:pointer;',
      open: 'background:#FFFFFF;border-color:#E3E8E5;color:#15241D;cursor:pointer;',
      off: 'background:#F3F6F4;border-color:#F3F6F4;color:#5E6C65;cursor:default;'
    };
    return {
      days: days.map((d) => ({ dow: d.dow, num: d.num, label: d.label, selected: d.k === 'sel', disabled: d.k === 'off', style: dayBase + tone[d.k] }))
    };
  }
}
</script>
</body>
</html>
