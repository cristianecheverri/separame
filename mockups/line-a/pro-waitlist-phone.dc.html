<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Citas · Lista de espera en el celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0B6E4F}a:hover{color:#084C37}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #F3F6F4; font-family: 'Figtree', system-ui, sans-serif; color: #15241D; display: flex; flex-direction: column">

  <header style="height: 60px; flex-shrink: 0; background: #0B6E4F; color: #FFFFFF; padding: 0 16px; display: flex; align-items: center; justify-content: space-between">
    <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.5px; line-height: 1">sepárame<span style="color: #FFC93C">.</span></span>
  </header>

  <main style="padding: 20px 16px 88px; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px; line-height: 1.15; letter-spacing: -0.8px">Citas</h1>
      <div style="font-size: 15px; color: #56645D">Tus citas próximas y pasadas, en un solo lugar.</div>
    </div>
    <div>
      <button style="height: 46px; padding: 0 20px; border-radius: 999px; border: 0; background: #0B6E4F; font: inherit; font-weight: 700; font-size: 14px; color: #FFFFFF; display: inline-flex; gap: 8px; align-items: center; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        Nueva cita
      </button>
    </div>

    <section style="background: #FFFFFF; border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 16px">
      <div role="group" aria-label="Mostrar" style="align-self: flex-start; display: flex; gap: 6px; background: #F3F6F4; border-radius: 999px; padding: 4px">
        <button aria-pressed="false" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 0; background: transparent; font: inherit; font-weight: 600; font-size: 14px; color: #3E4C45; white-space: nowrap; cursor: pointer">Próximas</button>
        <button aria-pressed="false" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 0; background: transparent; font: inherit; font-weight: 600; font-size: 14px; color: #3E4C45; white-space: nowrap; cursor: pointer">Pasadas</button>
        <button aria-pressed="true" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 0; background: #FFFFFF; font: inherit; font-weight: 700; font-size: 14px; color: #15241D; white-space: nowrap; cursor: pointer">Lista de espera</button>
      </div>

      <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{entries}}" as="e" hint-placeholder-count="5">
          <li style="{{e.rowStyle}}">
            <div style="display: flex; flex-direction: column; gap: 2px; flex: 1 1 0; min-width: 0">
              <span style="font-weight: 700; font-size: 15px">{{e.name}}</span>
              <span style="font-size: 13px; color: #3E4C45; line-height: 1.35">{{e.detail}}</span>
              <sc-if value="{{e.notified}}" hint-placeholder-val="{{ false }}">
                <span style="font-size: 12px; color: #56645D">Le avisamos 1 vez</span>
              </sc-if>
            </div>
            <button aria-label="{{e.agendarLabel}}" style="height: 44px; padding: 0 14px; border-radius: 999px; border: 0; background: #0B6E4F; color: #FFFFFF; font: inherit; font-weight: 700; font-size: 14px; flex-shrink: 0; cursor: pointer">Agendar</button>
            <button onClick="{{e.toggle}}" aria-label="{{e.moreLabel}}" aria-haspopup="menu" aria-expanded="{{e.open}}" style="{{e.moreStyle}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>

            <sc-if value="{{e.open}}" hint-placeholder-val="{{ false }}">
              <div role="menu" aria-label="{{e.moreLabel}}" style="position: absolute; right: 8px; top: calc(100% - 6px); width: 210px; background: #FFFFFF; border-radius: 18px; border: 1px solid #E3E8E5; box-shadow: 0 14px 32px rgba(21,36,29,0.18); padding: 6px; display: flex; flex-direction: column; z-index: 5">
                <a role="menuitem" href="#" style="min-height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-radius: 12px; color: #15241D; font-weight: 600; font-size: 15px; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"></path></svg>Llamar</a>
                <a role="menuitem" href="#" style="min-height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-radius: 12px; color: #15241D; font-weight: 600; font-size: 15px; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1.4-4.2A8 8 0 1 1 8.6 19z"></path></svg>WhatsApp</a>
                <sc-if value="{{e.email}}" hint-placeholder-val="{{ true }}">
                  <a role="menuitem" href="#" style="min-height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-radius: 12px; color: #15241D; font-weight: 600; font-size: 15px; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>Correo</a>
                </sc-if>
                <div aria-hidden="true" style="height: 1px; background: #E3E8E5; margin: 4px 6px"></div>
                <button role="menuitem" style="min-height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border: 0; border-radius: 12px; background: transparent; color: #7A3E00; font: inherit; font-weight: 700; font-size: 15px; text-align: left; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg>Quitar de la lista</button>
              </div>
            </sc-if>
          </li>
        </sc-for>
      </ul>
    </section>
  </main>
  <nav aria-label="Navegación principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 68px; box-sizing: border-box; background: #FFFFFF; border-top: 1px solid #E3E8E5; padding: 4px 8px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: center">
    <a href="pro-agenda-phone.dc.html" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none">
      <span style="width: 56px; height: 30px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: #56645D"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></span>
      <span style="font-size: 12px; color: #56645D; font-weight: 600">Agenda</span>
    </a>
    <a href="pro-waitlist-phone.dc.html" aria-current="page" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none">
      <span style="width: 56px; height: 30px; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: #EAF5F0; color: #0B6E4F"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"></path></svg></span>
      <span style="font-size: 12px; color: #0B6E4F; font-weight: 700">Citas</span>
    </a>
    <a href="pro-clients-phone.dc.html" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none">
      <span style="width: 56px; height: 30px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: #56645D"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"></path></svg></span>
      <span style="font-size: 12px; color: #56645D; font-weight: 600">Clientes</span>
    </a>
    <a href="pro-more-sheet-phone.dc.html" style="min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none">
      <span style="width: 56px; height: 30px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: #56645D"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"></path></svg></span>
      <span style="font-size: 12px; color: #56645D; font-weight: 600">Más</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"menu":{"editor":"enum","options":["none","0","1","2","3"],"default":"1"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const m = this.props.menu ?? '1';
    const initial = m !== 'none' ? Number(m) : -1;
    const st = Object.assign({ open: initial }, this.state || {});
    const row = 'position:relative;background:#F3F6F4;border-radius:16px;padding:12px 8px 12px 14px;display:flex;gap:6px;align-items:center;min-height:64px;box-sizing:border-box;';
    const more = 'width:44px;height:44px;border-radius:999px;border:0;color:#15241D;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;';
    const people = [
      { name: 'Paula Restrepo', detail: 'Limpieza dental · Jue 22 · Vie 23', notified: false, email: true },
      { name: 'Esteban Gil', detail: 'Valoración · Mié 21', notified: true, email: true },
      { name: 'Lina Marcela Ruiz', detail: 'Control · Lun 26 · Mar 27 · Mié 28', notified: false, email: false },
      { name: 'Andrés Cardona', detail: 'Valoración · Vie 23', notified: false, email: true }
    ];
    return {
      entries: people.map((p, i) => {
        const open = st.open === i;
        return Object.assign({}, p, {
          open,
          toggle: () => this.setState({ open: open ? -1 : i }),
          agendarLabel: 'Agendar una cita a ' + p.name,
          moreLabel: 'Más acciones para ' + p.name,
          rowStyle: row + (open ? 'z-index:4;' : ''),
          moreStyle: more + (open ? 'background:#FFFFFF;' : 'background:transparent;')
        });
      })
    };
  }
}
</script>
</body>
</html>
