<div style="min-height: 860px; box-sizing: border-box; background: #F3F6F4; font-family: 'Figtree', system-ui, sans-serif; color: #15241D; display: flex; flex-direction: column; align-items: center; padding: 64px 16px">

      <p style="margin: 0; font-size: 15px; color: #56645D; line-height: 1.45">Con tu correo y tu contraseña.</p>

    <div style="display: flex; flex-direction: column; gap: 6px">

  </main>
