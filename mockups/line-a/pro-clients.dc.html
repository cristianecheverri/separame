<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Clientes — línea A</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0B6E4F}a:hover{color:#084C37}
</style>
</helmet>
<div style="min-height: 920px; box-sizing: border-box; background: #F3F6F4; font-family: 'Figtree', system-ui, sans-serif; color: #15241D; display: flex; flex-wrap: wrap; align-items: stretch">

  <nav aria-label="Menú principal" style="flex: 1 1 220px; box-sizing: border-box; background: #0B6E4F; color: #FFFFFF; padding: 24px 16px; display: flex; flex-direction: column; gap: 6px">
    <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px; letter-spacing: -0.5px; padding: 0 12px 20px">sepárame<span style="color: #FFC93C">.</span></div>
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="9">
      <a href="{{n.href}}" style="{{n.style}}">{{n.label}}</a>
    </sc-for>
    <div style="margin-top: auto; padding-top: 16px; display: flex; flex-direction: column; gap: 8px">
      <div style="background: #FFC93C; color: #15241D; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
        <div style="font-size: 13px; font-weight: 700">Prueba gratis</div>
        <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px; line-height: 1.1">Te quedan 5 días</div>
        <a href="pro-billing-plans.dc.html" style="min-height: 44px; padding: 4px 12px; box-sizing: border-box; border-radius: 999px; background: #15241D; color: #FFFFFF; display: flex; align-items: center; justify-content: center; text-align: center; font-weight: 700; font-size: 14px; line-height: 1.2; text-decoration: none">Elegir plan · desde $5.000/mes</a>
      </div>
      <button style="min-height: 44px; padding: 0 12px; border-radius: 12px; border: 0; background: transparent; text-align: left; font: inherit; font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.8); cursor: pointer">Cerrar sesión</button>
    </div>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 32px; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: flex-end">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 34px; line-height: 1.2; letter-spacing: -0.8px">Clientes</h1>
        <div style="font-size: 15px; color: #56645D">Quiénes te han reservado, con su historial de citas.</div>
      </div>
      <label for="clients-search" style="height: 46px; min-width: 240px; box-sizing: border-box; border-radius: 999px; background: #FFFFFF; border: 2px solid #CFDAD4; display: flex; align-items: center; gap: 8px; padding: 0 14px; color: #56645D">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <input id="clients-search" type="search" placeholder="Buscar por nombre, correo o celular" aria-label="Buscar por nombre, correo o celular" style="border: 0; outline: none; font: inherit; font-size: 14px; flex-grow: 1; min-width: 0; background: transparent; color: #15241D">
      </label>
    </div>

    <section aria-label="Clientes" style="background: #FFFFFF; border-radius: 24px; padding: 8px 8px 12px">
      <div style="overflow-x: auto">
        <table style="width: 100%; min-width: 720px; border-collapse: collapse; font-size: 14px">
          <thead>
            <tr style="text-align: left; color: #56645D; font-size: 12px; text-transform: uppercase; letter-spacing: 0.4px">
              <th style="padding: 14px 14px 10px; font-weight: 700">Cliente</th>
              <th style="padding: 14px 10px 10px; font-weight: 700">Celular</th>
              <th style="padding: 14px 10px 10px; font-weight: 700">Citas</th>
              <th style="padding: 14px 10px 10px; font-weight: 700">Inasistencias</th>
              <th style="padding: 14px 10px 10px; font-weight: 700">Última</th>
              <th style="padding: 14px 10px 10px; font-weight: 700">Próxima</th>
              <th style="padding: 14px 14px 10px; font-weight: 700"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Acciones</span></th>
            </tr>
          </thead>
          <tbody>
            <sc-for list="{{clients}}" as="c" hint-placeholder-count="10">
              <tr style="border-top: 1px solid #E3E8E5">
                <td style="padding: 12px 14px">
                  <div style="font-weight: 700">{{c.name}}</div>
                  <div style="font-size: 13px; color: #56645D">{{c.email}}</div>
                </td>
                <td style="padding: 12px 10px; white-space: nowrap">{{c.phone}}</td>
                <td style="padding: 12px 10px">{{c.count}}</td>
                <td style="padding: 12px 10px">
                  <sc-if value="{{c.noShows}}" hint-placeholder-val="{{ false }}">
                    <span style="font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px; background: #FFE6CC; color: #7A3E00">{{c.noShows}}</span>
                  </sc-if>
                  <sc-if value="{{c.zero}}" hint-placeholder-val="{{ true }}">
                    <span style="color: #56645D">0</span>
                  </sc-if>
                </td>
                <td style="padding: 12px 10px; white-space: nowrap; color: #3E4C45">{{c.last}}</td>
                <td style="padding: 12px 10px; white-space: nowrap; color: #3E4C45">{{c.next}}</td>
                <td style="padding: 12px 14px; text-align: right">
                  <a href="pro-client-detail.dc.html" aria-label="Ver {{c.name}}" style="font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; min-height: 44px; text-decoration: underline; text-underline-offset: 2px">Ver</a>
                </td>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":920}}'>

    const navBase = 'display:flex;align-items:center;min-height:44px;padding:0 12px;border-radius:12px;font-weight:600;font-size:15px;text-decoration:none;';

      ['Lucía Restrepo', 'lucia.restrepo@correo.co', '+57 300 137 2193', 16, 1, '14 oct. 2026', '21 oct. 2026'],
      ['Andrés Cardona', 'andres.cardona@correo.co', '+57 300 138 0112', 16, 3, '14 oct. 2026', '21 oct. 2026'],
      ['Miguel Ángel Toro', 'miguel.angel.toro@correo.co', '+57 300 133 2598', 12, 4, '7 oct. 2026', '22 oct. 2026'],
      ['Camila Zapata', 'camila.zapata@correo.co', '+57 300 134 0517', 15, 1, '19 oct. 2026', '22 oct. 2026'],
      ['Isabela Montoya', 'isabela.montoya@correo.co', '+57 300 141 9707', 12, 0, '19 oct. 2026', '22 oct. 2026'],

      clients: rows.map(([name, email, phone, count, noShows, last, next]) => ({ name, email, phone, count, noShows: noShows || 0, zero: !noShows, last, next }))
    };
  }
}
</script>
</body>
</html>
