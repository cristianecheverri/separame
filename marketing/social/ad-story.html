<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="brand.css" />
  <style>
    /* 1080 × 1920 (9:16): stories and reels. The top 250 px and bottom 340 px are covered
       by Instagram's profile row and the call-to-action button, so they carry nothing key. */
    .canvas { width: 1080px; height: 1920px; }
    .text { position: absolute; left: 80px; right: 80px; top: 270px; text-align: center; }
    .wordmark { font-size: 50px; }
    .headline { margin-top: 40px; font-size: 100px; }
    .sub { margin: 28px auto 0; font-size: 38px; width: 860px; }
    .phone { left: 280px; top: 930px; width: 520px; border-width: 16px; border-radius: 80px; }
    .card { gap: 18px; padding: 22px 32px 22px 22px; }
    .card .icon { width: 64px; height: 64px; }
    .card b { font-size: 28px; }
    .card span { font-size: 24px; }
    .c1 { left: 40px; top: 1290px; }
    .c2 { right: 40px; top: 1060px; }
    .pill-row { margin-top: 44px; }
    .pill { padding: 22px 40px; font-size: 38px; }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="blob" style="width: 700px; height: 700px; left: -300px; top: 760px"></div>
    <div class="blob" style="width: 620px; height: 620px; left: 760px; top: -120px"></div>

    <div class="text">
      <div class="wordmark">sepárame<span class="dot">.</span></div>
      <h1 class="headline">Deja de agendar<br /><em>por WhatsApp.</em></h1>
      <p class="sub">Tus clientes separan su cita desde tu enlace,<br />a cualquier hora.</p>
      <div class="pill-row"><span class="pill">Prueba gratis 15 días</span></div>
    </div>

    <div class="phone"><img src="assets/booking-day-time.png" alt="" /></div>

    <div class="card c1">
      <div class="icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#15241D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>
      </div>
      <div><b>Cita confirmada</b><span>Jue 22 · 10:00 a. m.</span></div>
    </div>
    <div class="card c2">
      <div class="icon green">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#0B6E4F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" /><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" /></svg>
      </div>
      <div><b>Recordatorio enviado</b><span>Un día antes, solito</span></div>
    </div>

  </div>
</body>
</html>
