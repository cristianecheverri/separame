<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="brand.css" />
  <style>
    /* Facebook shows the full width on desktop and roughly the middle 1110 px on phones,
       so everything important lives between x = 265 and x = 1375. */
    .canvas { width: 1640px; height: 624px; }
    .text { position: absolute; left: 300px; top: 112px; width: 640px; }
    .wordmark { font-size: 44px; }
    .headline { margin-top: 34px; font-size: 68px; }
    .sub { margin-top: 22px; font-size: 26px; }
    .row { margin-top: 30px; display: flex; align-items: center; gap: 22px; }
    .pill { padding: 14px 26px; font-size: 24px; }
    .url { font-size: 24px; }
    .phone { left: 1010px; top: 70px; width: 330px; border-width: 11px; border-radius: 52px; }
    .card { left: 905px; top: 470px; gap: 16px; padding: 18px 26px 18px 18px; }
    .card .icon { width: 52px; height: 52px; }
    .card b { font-size: 21px; }
    .card span { font-size: 18px; }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="blob" style="width: 520px; height: 520px; left: -160px; top: -220px"></div>
    <div class="blob" style="width: 640px; height: 640px; left: 1180px; top: 220px"></div>

    <div class="text">
      <div class="wordmark">sepárame<span class="dot">.</span></div>
      <h1 class="headline">Tus clientes separan cita desde <em>un enlace.</em></h1>
      <p class="sub">Sin llamadas ni mensajes de ida y vuelta.</p>
      <div class="row">
        <span class="pill">Prueba gratis 10 días</span>
        <span class="url">separame.app</span>
      </div>
    </div>

    <div class="phone"><img src="assets/booking-day-time.png" alt="" /></div>

    <div class="card">
      <div class="icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#15241D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>
      </div>
      <div><b>Cita confirmada</b><span>Jue 22 · 10:00 a. m.</span></div>
    </div>
  </div>
</body>
</html>
